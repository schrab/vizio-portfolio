<!DOCTYPE html>
<html lang="{{ page.lang | default: 'ru' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }}</title>
    <meta name="description" content="{{ site.description }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
    <div class="lang-switcher">
        <a href="{{ '/' | relative_url }}" class="{% if page.lang == 'ru' %}active{% endif %}">RU</a>
        <a href="{{ '/en/' | relative_url }}" class="{% if page.lang == 'en' %}active{% endif %}">EN</a>
        <a href="{{ '/vi/' | relative_url }}" class="{% if page.lang == 'vi' %}active{% endif %}">VI</a>
    </div>

    <main>
        {{ content }}
    </main>
</body>
</html>
